appId: gg.qubiq.launcher
productName: QubiQ Server Launcher
copyright: Copyright © 2026 AitorMencias. GPLv3.

directories:
  output: release
  buildResources: build

# Sin publicación automática: con `repository` en package.json electron-builder
# deduciría GitHub y podría intentar subir la release. Se publica a mano, y la
# app no se autoactualiza (no hay app-update.yml que leer).
publish: null

# Solo se empaqueta lo compilado. El código fuente, los scripts de prueba y
# node_modules quedan fuera: React y el resto los inlinea Vite en el bundle.
files:
  - out/**/*
  - package.json

# `asar` mantiene los recursos en un único archivo. La app nunca lee ficheros
# desde su propia carpeta de instalación —todo vive en userData—, así que no
# hay nada que desempaquetar.
asar: true
compression: normal

# Los plugins oficiales van FUERA del asar: hay que copiarlos a la carpeta del
# servidor como ficheros de verdad, y desde dentro del archivo no se puede.
extraResources:
  - from: resources
    to: .
    filter:
      - '**/*'
  # Licencia y avisos de terceros, que «Acerca de» abre con el Bloc de notas
  # (GPLv3 §0 y §5d). Los avisos los genera la compilación a partir de lo que
  # entra de verdad en el bundle (scripts/third-party-notices.ts).
  - from: LICENSE
    to: LICENSE.txt
  - from: out/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Sin firma de código, por decisión de proyecto (§13.3). SmartScreen avisará
  # en la primera ejecución hasta que haya reputación o certificado gratuito.
  signAndEditExecutable: true

nsis:
  # Instalación por usuario: no pide permisos de administrador (§12).
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: QubiQ Server Launcher
  artifactName: QubiQ-Server-Launcher-Setup-${version}.${ext}
  # Los servidores y mundos viven en %APPDATA%, fuera de la carpeta de
  # instalación: desinstalar nunca debe llevarse por delante las partidas.
  deleteAppDataOnUninstall: false
  uninstallDisplayName: QubiQ Server Launcher

portable:
  artifactName: QubiQ-Server-Launcher-${version}-portable.${ext}
