<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rust">
<!-- Icono propio de QubiQ Server Launcher (GPLv3). No es un logotipo oficial de Rust
     ni está hecho a partir de él: evoca el tema del juego sin usar sus marcas.
     Criterio en ANALISIS.md §13.1. -->
<defs>
